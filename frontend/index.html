<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7A3416" />
  <meta name="description" content="EcoFridge AI — следи за сроками годности, используй продукты вовремя и готовь из того, что уже есть дома." />
  <title>EcoFridge AI · Astana</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237A3416'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle'%3E🥬%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { corePlugins: { preflight: true }, theme: { extend: { fontFamily: { sans: ['Manrope', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="font-sans">
  <a href="#view" class="skip-link" id="skip-link">Перейти к содержимому</a>

  <div class="app">
    <aside class="sidebar" aria-label="Основная навигация">
      <a href="#/" class="brand" aria-label="EcoFridge AI — на главную">
        <span class="brand-mark" aria-hidden="true">🥬</span>
        <span><strong>EcoFridge AI</strong><small>Astana</small></span>
      </a>
      <nav id="nav" class="nav"></nav>
      <a href="#/about" class="plan-badge" title="О тарифе">
        <span class="plan-name">Семейный Pro</span>
        <span class="plan-price">1 499 ₸/мес</span>
      </a>
    </aside>

    <div class="content">
      <header class="topbar">
        <a href="#/" class="brand brand-mobile" aria-label="EcoFridge AI — на главную">
          <span class="brand-mark" aria-hidden="true">🥬</span><strong>EcoFridge AI</strong>
        </a>
        <div class="topbar-right">
          <a href="#/about" class="plan-chip">Семейный Pro · 1 499 ₸/мес</a>
          <span id="status-chip" class="chip chip-muted" role="status" aria-live="polite"><span class="dot"></span><span id="status-text">Проверка связи…</span></span>
        </div>
      </header>

      <div id="demo-banner" class="demo-banner" hidden role="status"></div>

      <main id="view" class="view" tabindex="-1"></main>

      <footer class="footer">
        <span>EcoFridge AI · AuaHack 2026 · Астана</span>
        <a href="#/about">Как это работает</a>
      </footer>
    </div>
  </div>

  <nav id="bottom-nav" class="bottom-nav" aria-label="Мобильная навигация"></nav>

  <!-- Add item -->
  <dialog id="add-dialog" class="modal" aria-labelledby="add-title">
    <form id="add-form" novalidate>
      <div class="modal-head">
        <h2 id="add-title">Добавить продукт</h2>
        <button type="button" class="icon-btn" data-close aria-label="Закрыть">✕</button>
      </div>
      <p id="add-mode-note" class="field-hint"></p>
      <div class="field">
        <label for="f-name">Название</label>
        <input id="f-name" name="name" type="text" maxlength="80" autocomplete="off" required aria-describedby="e-name" placeholder="Например, Молоко 2.5%" />
        <p class="field-error" id="e-name" role="alert"></p>
      </div>
      <div class="field">
        <label for="f-category">Категория</label>
        <select id="f-category" name="category"></select>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-price">Цена, ₸</label>
          <input id="f-price" name="price_tenge" type="number" inputmode="numeric" min="0" max="1000000" step="1" value="500" required aria-describedby="e-price" />
          <p class="field-error" id="e-price" role="alert"></p>
        </div>
        <div class="field">
          <label for="f-weight">Вес, кг</label>
          <input id="f-weight" name="weight_kg" type="number" inputmode="decimal" min="0.01" max="50" step="0.01" value="1" required aria-describedby="e-weight" />
          <p class="field-error" id="e-weight" role="alert"></p>
        </div>
        <div class="field">
          <label for="f-days">Дней до конца срока</label>
          <input id="f-days" name="days_left" type="number" inputmode="numeric" min="0" max="365" step="1" value="3" required aria-describedby="e-days" />
          <p class="field-error" id="e-days" role="alert"></p>
        </div>
      </div>
      <p class="field-error" id="e-form" role="alert"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close>Отмена</button>
        <button type="submit" class="btn btn-primary" id="add-submit">Добавить в холодильник</button>
      </div>
    </form>
  </dialog>

  <!-- Confirm delete -->
  <dialog id="confirm-dialog" class="modal modal-sm" aria-labelledby="confirm-title">
    <form method="dialog" id="confirm-form">
      <h2 id="confirm-title">Удалить продукт?</h2>
      <p id="confirm-text" class="muted"></p>
      <p class="field-hint">Удаление не засчитывается как «съели» и не влияет на экономию.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close>Отмена</button>
        <button type="submit" class="btn btn-danger" id="confirm-ok" value="ok">Удалить</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
